<section id="location" class="relative overflow-hidden bg-[#F7F5F0] px-6 py-28 md:px-10 md:py-40">
  <div class="mx-auto max-w-6xl">
    <!-- Header -->
    <div class="mb-20 text-center md:mb-28">
      <p class="mb-6 text-[10px] tracking-[0.45em] text-[#99958D] md:text-xs">GETTING THERE</p>

      <h2 class="font-serif text-4xl font-light tracking-[0.04em] text-[#292824] md:text-5xl">The Venue</h2>

      <p class="mx-auto mt-6 max-w-md text-sm font-light leading-7 tracking-[0.12em] text-[#77736C]">
        期待在這個特別的地方，
        <br />
        與您一起分享我們的重要時刻。
      </p>
    </div>

    <!-- Main -->
    <div class="grid items-stretch md:grid-cols-2">
      <!-- Image -->
      <div class="relative min-h-[420px] overflow-hidden md:min-h-[620px]">
        <img src="images/venue.jpg" alt="Wedding venue" class="absolute inset-0 h-full w-full object-cover" />

        <div class="absolute inset-0 bg-black/10"></div>

        <!-- Number -->
        <span class="absolute bottom-6 left-6 font-serif text-sm italic tracking-[0.15em] text-white/80">
          01 — VENUE
        </span>
      </div>

      <!-- Information -->
      <div class="flex min-h-[520px] items-center bg-white px-8 py-16 md:min-h-[620px] md:px-16 lg:px-20">
        <div class="w-full">
          <p class="mb-7 text-[10px] tracking-[0.4em] text-[#99958D]">WEDDING RECEPTION</p>

          <!-- Venue -->
          <h3 class="font-serif text-3xl font-light leading-relaxed tracking-[0.04em] text-[#292824] md:text-4xl">
            Wedding Venue
          </h3>

          <!-- Address -->
          <p class="mt-6 text-sm font-light leading-8 tracking-[0.1em] text-[#77736C]">
            台中市婚宴會館
            <br />
            台中市 ○○ 區 ○○ 路 000 號
          </p>

          <!-- Divider -->
          <div class="my-10 h-px w-full bg-[#E7E3DB]"></div>

          <!-- Time -->
          <div class="grid grid-cols-2 gap-8">
            <div>
              <p class="mb-3 text-[9px] tracking-[0.3em] text-[#AAA69E]">DATE</p>

              <p class="font-serif text-lg text-[#494640]">May 22, 2027</p>
            </div>

            <div>
              <p class="mb-3 text-[9px] tracking-[0.3em] text-[#AAA69E]">TIME</p>

              <p class="font-serif text-lg text-[#494640]">11:30 AM</p>
            </div>
          </div>

          <!-- Transportation -->
          <div class="mt-10">
            <p class="mb-3 text-[9px] tracking-[0.3em] text-[#AAA69E]">TRANSPORTATION</p>

            <p class="text-sm font-light leading-7 tracking-[0.08em] text-[#77736C]">
              現場備有停車空間
              <br />
              詳細交通資訊將於婚禮前提供
            </p>
          </div>

          <!-- Google Maps -->
          <a
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="group mt-12 inline-flex items-center gap-5 border-b border-[#292824] pb-2 text-[10px] tracking-[0.35em] text-[#292824] transition-opacity duration-300 hover:opacity-50"
          >
            OPEN IN GOOGLE MAPS

            <span class="text-base transition-transform duration-300 group-hover:translate-x-1"> → </span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
