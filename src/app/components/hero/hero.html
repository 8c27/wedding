<section class="relative h-dvh min-h-[650px] w-full overflow-hidden bg-stone-900">
  <!-- Wedding photo -->
  <img
    src="images/hero.jpg"
    alt="Wedding"
    class="absolute inset-0 h-full w-full object-cover object-[center_50%] md:object-[center_40%]"
  />
  <!-- Overlay -->
  <div class="absolute inset-0 bg-black/25"></div>

  <div
    class="pointer-events-none absolute inset-x-0 bottom-0 z-[1] h-32 bg-gradient-to-b from-transparent via-[#F7F5F0]/30 to-[#F7F5F0] md:h-40"
  ></div>

  <!-- Header -->
  <header
    class="absolute inset-x-0 top-0 z-20 flex items-center justify-between px-6 py-7 text-white md:px-12 md:py-10"
  >
    <span class="text-[10px] tracking-[0.35em] md:text-xs"> WEDDING INVITATION </span>

    <span class="text-[10px] tracking-[0.35em] md:text-xs"> 2026 </span>
  </header>
  <!-- Main -->
  <div class="absolute inset-x-0 top-[24%] z-10 px-6 text-center text-white md:hidden">
    <p class="text-[10px] tracking-[0.5em] uppercase md:text-xs">We're getting married</p>
  </div>

  <!-- Names -->
  <div class="absolute inset-x-0 top-[70%] z-10 px-6 text-center text-white md:top-[60%]">
    <div class="mx-auto flex max-w-lg items-center justify-center gap-5 md:gap-10">
      <!-- Groom -->
      <div class="min-w-0 flex-1">
        <h1 class="whitespace-nowrap font-serif text-3xl font-light tracking-[0.12em] md:text-5xl">陸韋呈</h1>

        <p class="mt-2 text-[8px] tracking-[0.35em] uppercase text-white/80 md:text-[10px]">Wei Cheng</p>
      </div>

      <!-- & -->
      <span class="shrink-0 font-serif text-2xl font-light italic md:text-3xl"> & </span>

      <!-- Bride -->
      <div class="min-w-0 flex-1">
        <h1 class="whitespace-nowrap font-serif text-3xl font-light tracking-[0.12em] md:text-5xl">江妍欣</h1>

        <p class="mt-2 text-[8px] tracking-[0.35em] uppercase text-white/80 md:text-[10px]">Yan Sin</p>
      </div>
    </div>

    <div class="mx-auto my-6 h-px w-10 bg-white/70"></div>

    <p class="text-xs tracking-[0.4em] md:text-sm">2026 · 12 · 06</p>
  </div>

  <!-- Scroll indicator -->
  <div class="absolute bottom-0 left-1/2 z-20 flex -translate-x-1/2 flex-col items-center text-white">
    <span class="mb-3 text-[9px] tracking-[0.35em]"> SCROLL </span>

    <div class="relative h-14 w-px overflow-hidden bg-white/20">
      <div class="scroll-line absolute left-0 top-0 h-6 w-px bg-white"></div>
    </div>
  </div>
</section>
